<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RSU-SDPO | Reports</title>
  <link rel="stylesheet" href="../../css/shared/app-shell.css">
  <style>
    /* Standalone implementation of the Reports Figma frames. */
    .content{width:100%;max-width:1200px;margin:auto;padding:24px 62px 36px}
    .pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.actions{display:flex;gap:7px}.calendar-link{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 13px;border-radius:7px;border:1px solid var(--line);background:var(--page);color:var(--ink);font-size:11px;text-decoration:none}.calendar-link:hover{background:var(--softline)}.btn{height:28px;padding:0 13px;border-radius:7px;border:1px solid var(--green);background:var(--page);color:var(--green);font-size:11px;cursor:pointer}.btn.primary{background:var(--green);color:#fff}.btn.print{background:#9edccb;border-color:#9edccb;color:#fff}.filters{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:15px 13px;display:flex;align-items:end;gap:11px;margin-bottom:17px}.field{display:grid;gap:5px}.field label{font-size:10px;color:var(--muted)}.filters select{appearance:none;height:29px;border:1px solid var(--line);border-radius:7px;background:var(--softline);color:var(--ink);font:11px inherit;padding:0 27px 0 10px;min-width:140px;background-image:linear-gradient(45deg,transparent 50%,#8aa0b9 50%),linear-gradient(135deg,#8aa0b9 50%,transparent 50%);background-position:calc(100% - 12px) 12px,calc(100% - 9px) 12px;background-size:3px 3px,3px 3px;background-repeat:no-repeat}.field.quarter select{min-width:102px}.field.year select{min-width:82px}.filters .generate{height:30px}.reset{border-color:var(--line);color:var(--muted)}.empty{height:234px;border:1px solid var(--line);border-radius:10px;background:var(--page);display:grid;place-items:center;text-align:center;color:var(--muted)}.emptyicon{width:56px;height:56px;margin:auto auto 12px;border-radius:13px;background:#eef4fb;display:grid;place-items:center;font-size:24px;color:#c0d1e6}.empty b{display:block;color:var(--muted);margin-bottom:7px}.empty span{font-size:11px;display:block}.empty em{font-style:normal;color:var(--green);font-size:11px}.paper{max-width:542px;margin:0 auto;background:#fff;border:1px solid #d7dde5;box-shadow:0 2px 3px #182b4a20;padding:29px 38px 26px;color:#1f2937}
    /* Two-seal letterhead (2026-09-13 redesign, matches the approved "A4
       Overdue Report Design" mockup): the Romblon State University seal on
       the left and the SDPO gear logo on the right, flanking the centered
       Republic/University/Place text block, with a rule above and below
       the office name. This mirrors the PDF/Excel export header in
       server/reports/templates/reportRenderer.js exactly — that file was
       already redesigned this way, but this on-screen preview template
       was missed at the time, so the preview kept showing the old
       single-centered-logo layout while the actual exported files did not. */
    .reportletter{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}.reportletter .seal{width:44px;height:44px;object-fit:contain;flex-shrink:0}.university{text-align:center}.university small{color:#4b5563;font-size:7px}.university h2{font-size:11px;margin:2px 0 1px;color:#0f172a}.university .place{font-size:7px;color:#4b5563}.letterrule{border-top:1.4px solid #000;margin:8px 0}.office{text-align:center;letter-spacing:1px;font-size:8px;font-weight:700;color:#0f172a}.reporttitle{text-align:center;font-size:11px;letter-spacing:.55px;margin:9px 0 12px;font-weight:700;color:#0f172a}
    /* Meta row (2026-09-14 redesign, matches server/reports/templates/
       reportRenderer.js's PDF exactly): "Report Period"/"Quarter" stacked
       on the left, "Generated On" on the right, sharing one row — not the
       old 2x2 grid that also carried "Generated By" (never part of the PDF
       header at all; that credit still appears below in the Prepared-by
       signature line, just not up here). */
    .reportmeta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:8px;margin-bottom:12px;color:#374151}.reportmeta .meta-right{text-align:right}.reportmeta div+div{margin-top:2px}.reportmeta b{font-weight:600;color:#111827}
    /* Summary (moved to sit right after the meta row and before the table,
       same position/order as the PDF, and restyled from stat "tiles" to a
       plain bold-label + text-line list — the PDF's Summary is plain text,
       not colored cards). */
    .summarylabel{font-size:9px;font-weight:700;margin:0 0 4px;color:#0f172a}.summary{display:flex;flex-direction:column;gap:1px;font-size:8px;margin-bottom:14px;color:#374151}.summary b{font-weight:600;color:#111827}
    /* Table: plain header (bold black text over a rule, no colored banner)
       and borderless rows with only a faint separator — mirrors the PDF's
       drawRow/drawHeader, which never fills or outlines cells. */
    .reporttable{width:100%;border-collapse:collapse;font-size:8px}.reporttable th{background:#fff;color:#0f172a;text-align:left;padding:6px 7px;white-space:nowrap;font-weight:700;border-bottom:1.6px solid #000}.reporttable td{padding:6px 7px;vertical-align:middle;border-bottom:1px solid #e8edf3;color:#1f2937}
    .signatures{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:22px;font-size:8px;color:#8aa0b9}.signature{border-bottom:1px solid #aabbd0;padding-bottom:7px;margin-top:14px;color:#314158;font-weight:600}.sigrole{font-size:8px;line-height:1.45;color:#71829b;margin-top:4px}.docfoot{display:flex;justify-content:space-between;color:#9aabc1;font-size:7px;margin-top:36px}.hidden{display:none!important}
    @media(max-width:850px){.content{padding:22px 20px}.filters{flex-wrap:wrap}.pagehead{flex-wrap:wrap}}
    @media(max-width:570px){.content{padding:18px 12px}.filters{gap:8px}.filters .field{flex:1}.filters select{min-width:100%;width:100%}.paper{padding:24px 14px;overflow-x:auto}.reporttable{min-width:480px}.docfoot{gap:15px}.actions{flex-wrap:wrap}}
    /* Printing previously printed the whole page — sidebar, topbar, filter
       bar, and buttons included — instead of just the generated report.
       app-shell.js nests the page's real content several levels deep
       (body > .app-shell-root > .app > main > .content > #paper), so a
       naive "body>*:not(#paper){display:none}" rule (the approach
       qr-management.html's print sheet already used) only ever reaches
       #paper's great-great-grandparent — hiding that ancestor with
       display:none hides #paper too, since a display:none ancestor is
       never rendered regardless of what a descendant's own display is
       set to. visibility works differently: it doesn't remove the box
       from layout, so a descendant can re-declare visibility:visible and
       actually show through a hidden ancestor. Confirmed with a real
       headless-Chromium print-to-PDF render, not just reasoned about. */
    @media print{
      @page{margin:14mm}
      body *{visibility:hidden}
      #paper,#paper *{visibility:visible}
      #paper{position:absolute;top:0;left:0;width:100%;margin:0;box-shadow:none;border:0;max-width:none}
    }
  </style>
</head>
<body>
  <div id="app-root" data-page="reports" data-title="Reports" data-subtitle="Generate official quarterly administrative reports">
    <div class="pagehead"><a class="calendar-link" href="transaction-log-report.html">▤ &nbsp; Transaction Log Report (Calendar)</a><div class="actions"><button class="btn" id="pdf">⇩ &nbsp; Export PDF</button><button class="btn" id="excel">⇩ &nbsp; Export Excel</button><button class="btn print" id="print">▣ &nbsp; Print</button></div></div>
    <div class="filters"><div class="field"><label>Report Type</label><select id="type"><option value="empty">Select Report</option><option value="borrowing">Borrowing Report</option><option value="overdue">Overdue Report</option><option value="utilization">Equipment Utilization Report</option><option value="inventory">Equipment Inventory Report</option><option value="history">Transaction History Report</option><option value="condition">Equipment Condition Report</option></select></div><div class="field quarter"><label>Quarter</label><select id="quarter"><option value="" selected>Select quarter...</option><option value="1">1st Quarter</option><option value="2">2nd Quarter</option><option value="3">3rd Quarter</option><option value="4">4th Quarter</option></select></div><div class="field year"><label>Year</label><select id="year"></select></div><button class="btn primary generate" id="generate">▧ &nbsp; Generate Report</button><button class="btn reset" id="reset">⟳ &nbsp; Reset</button></div>
    <div id="empty" class="empty"><div><div class="emptyicon">▣</div><b>No report has been generated yet.</b><span>Select a report type, quarter, and year then click</span><em>Generate Report.</em></div></div>
    <article id="paper" class="paper hidden"></article>
  </div>
  <script src="../../js/shared/api.js"></script>
  <script src="../../js/shared/app-shell.js"></script>
  <script>
    const paper=document.querySelector('#paper'),empty=document.querySelector('#empty'),type=document.querySelector('#type'),quarterSel=document.querySelector('#quarter'),yearSel=document.querySelector('#year');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const QUARTER_LABELS={1:'1st Quarter',2:'2nd Quarter',3:'3rd Quarter',4:'4th Quarter'};
    const QUARTER_MONTHS={1:'January – March',2:'April – June',3:'July – September',4:'October – December'};

    (function populateYears(){
      // No year is pre-selected here — the placeholder ("Select year...")
      // stays selected on load, matching Report Type's own "Select Report"
      // placeholder, so every filter starts genuinely unset instead of
      // silently defaulting to the current year on every visit.
      const current=new Date().getFullYear();
      let opts='<option value="" selected>Select year...</option>';
      for(let y=current+1;y>=current-3;y--)opts+=`<option value="${y}">${y}</option>`;
      yearSel.innerHTML=opts;
    })();

    // Plain text, no colored badge — matches the PDF's own table cells,
    // which are always plain Helvetica text with no fill/color per value
    // (server/reports/templates/reportRenderer.js#drawRow never sets a
    // per-cell fillColor). The colored status "pill" chips this used to
    // render were the on-screen preview's own addition, not something the
    // downloadable PDF/Excel ever had.
    function pill(v){return esc(v)}

    function showEmpty(){paper.classList.add('hidden');empty.classList.remove('hidden')}

    let generatedSeq=0;
    async function render(kind){
      if(kind==='empty'){showEmpty();return}
      const quarter=quarterSel.value,year=yearSel.value;
      if(!quarter||!year){showEmpty();showToast('Select a quarter and year first.');return}

      const seq=++generatedSeq;
      let r;
      try{
        r=await apiFetch(`/api/reports/${kind}?quarter=${quarter}&year=${year}`);
      }catch(err){
        if(seq===generatedSeq)showToast('Could not generate report: '+err.message);
        return;
      }
      if(seq!==generatedSeq)return; // a newer request superseded this one

      const currentUser=(function(){try{return JSON.parse(localStorage.getItem('rsuSdpoUser')||'null')}catch(e){return null}})();
      const generatedBy=esc(currentUser?currentUser.username:'SDPO Staff');
      // Medium #11 from the 2026-09-08 system audit: this signature block
      // used to print "Administrative Aide VI / Property Custodian" under
      // *whoever actually generated the report*, regardless of their real
      // role — wrong for a Director or for the other of the two staff
      // roles. userRole only has 4 values (Admin/Director/Staff/Borrower;
      // Borrower accounts can't reach this admin page), so it can't
      // distinguish the Administrative Aide VI from the Student Assistant
      // within 'Staff' — both are represented the same way in the schema —
      // but it's no longer flatly wrong for the other roles.
      const ROLE_TITLES={
        Admin:'Property Custodian (System Administrator)',
        Staff:'Administrative Aide VI',
        Director:'Director, Sports Development Program Office'
      };
      const generatedByRole=esc(ROLE_TITLES[currentUser&&currentUser.userRole]||'SDPO Staff');
      // Matches reportRenderer.js's own `new Date().toLocaleString('en-US')`
      // (date + time) instead of a date-only string, so "Generated On" reads
      // the same way here as it does in the downloaded PDF/Excel.
      const generatedOn=new Date().toLocaleString('en-US');
      const docId=`RSU-SDPO-${year}-Q${quarter}-${String(Date.now()).slice(-4)}`;

      empty.classList.add('hidden');paper.classList.remove('hidden');
      // Layout order below (letterhead -> meta -> Summary -> table ->
      // signatures/footer) and the meta row's own left/right split match
      // server/reports/templates/reportRenderer.js's PDF exactly: "Report
      // Period"/"Quarter" stacked on the left, "Generated On" alone on the
      // right, then a plain-text Summary list (not stat tiles) sitting
      // BEFORE the table rather than after it. "Generated By" is no longer
      // shown up here (the PDF never had it) — it still appears below in
      // the Prepared-by signature line, which the PDF doesn't render at all
      // but is kept here since it's a genuinely useful on-screen/print
      // addition, not something being removed for parity's sake.
      paper.innerHTML=`<div class="reportletter"><img class="seal" src="../../assets/images/rsu-university-seal.png" alt="Romblon State University seal"><div class="university"><small>Republic of the Philippines</small><h2>ROMBLON STATE UNIVERSITY</h2><span class="place">Romblon, Philippines</span></div><img class="seal" src="../../assets/images/rsu-sdpo-logo.png" alt="RSU SDPO seal"></div><div class="letterrule"></div><div class="office">SPORTS DEVELOPMENT PROGRAM OFFICE</div><div class="letterrule"></div><h3 class="reporttitle">${esc(r.title)}</h3><div class="reportmeta"><div class="meta-left"><div><b>Report Period:</b> ${QUARTER_MONTHS[quarter]}, ${year}</div><div><b>Quarter:</b> ${QUARTER_LABELS[quarter]}</div></div><div class="meta-right"><div><b>Generated On:</b></div><div>${generatedOn}</div></div></div>${r.stats.length?`<div class="summarylabel">Summary</div><div class="summary">${r.stats.map(s=>`<div><b>${esc(s[0])}:</b> ${esc(s[1])}</div>`).join('')}</div>`:''}<table class="reporttable"><thead><tr>${r.heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${r.data.length?r.data.map(d=>`<tr>${d.map(v=>`<td>${pill(v)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${r.heads.length}" style="text-align:center;color:#8aa0b9">No records for this period.</td></tr>`}</tbody></table><div class="signatures"><div><span>Prepared by:</span><div class="signature">${generatedBy}</div><div class="sigrole">${generatedByRole}</div></div><div><span>Verified by:</span><div class="signature">Alphee F. Lachica</div><div class="sigrole">Director<br>Sports Development Program Office<br>Romblon State University</div></div></div><div class="docfoot"><span>Document ID: ${docId}</span><span>System: RSU SDPO</span><span>Page 1 of 1</span></div>`;
    }

    function showToast(message){
      let toast=document.getElementById('reportsToast');
      if(!toast){toast=document.createElement('div');toast.id='reportsToast';toast.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d293d;color:#fff;padding:11px 15px;border-radius:9px;font-size:13px;z-index:20;box-shadow:0 10px 25px #1d293d33';document.body.appendChild(toast);}
      toast.textContent=message;toast.style.opacity='1';
      clearTimeout(showToast._t);showToast._t=setTimeout(()=>{toast.style.opacity='0'},2600);
    }

    async function downloadReport(format,ext){
      const kind=type.value,quarter=quarterSel.value,year=yearSel.value;
      if(!kind||kind==='empty'||!quarter||!year){showToast('Select report type, quarter, and year first.');return}

      let res;
      try{
        const token=localStorage.getItem('rsuSdpoToken');
        const headers=token?{Authorization:'Bearer '+token}:{};
        res=await fetch(`/api/reports/${kind}?quarter=${quarter}&year=${year}&format=${format}`,{headers});
      }catch(err){
        showToast('Could not export report: '+err.message);
        return;
      }
      if(!res.ok){
        let message='Request failed ('+res.status+')';
        try{const body=await res.json();if(body&&body.message)message=body.message}catch(e){}
        showToast('Could not export report: '+message);
        return;
      }

      const blob=await res.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`${kind}-report-Q${quarter}-${year}.${ext}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    document.querySelector('#generate').onclick=()=>render(type.value);
    // Reset previously only cleared the report type — the Quarter and Year
    // selects were left at whatever the user had last picked, which reads
    // as a broken Reset button. Now restores all three filters to the same
    // "nothing chosen yet" placeholder state the page itself starts in
    // (Select Report / Select quarter... / Select year...) — Quarter/Year
    // used to snap back to 1st Quarter / the current year specifically,
    // which was really just a second, less obvious way of the exact same
    // "why does this always show 1st Quarter 2026" complaint the on-load
    // defaults had.
    document.querySelector('#reset').onclick=()=>{type.value='empty';quarterSel.value='';yearSel.value='';showEmpty()};
    document.querySelector('#print').onclick=()=>{
      if(paper.classList.contains('hidden')){showToast('Generate a report first, then Print.');return}
      window.print();
    };
    document.querySelector('#pdf').onclick=()=>downloadReport('pdf','pdf');
    document.querySelector('#excel').onclick=()=>downloadReport('excel','xlsx');
    showEmpty();
  </script>
</body>
</html>
