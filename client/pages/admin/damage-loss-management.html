<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damage and Loss Record Management | RSU-SDPO</title>
  <link rel="stylesheet" href="../../css/shared/app-shell.css">
  <style>
    /* Standalone Figma implementation — Damage & Loss Records (node 2607:42) */
    :root{--faint:#90a1b9;--paper:#fff;--green2:#00bc7d;--green-pale:#ecfdf5;--amber-pale:#fef3c7;--red:#c10007;--red-pale:#fef2f2;--purple-pale:#ede9fe;--purple:#7c3aed;--text:#45556c;--line2:#f1f5f9}
    body{font-size:14px}
    .content{padding:16px 32px 24px}
    .page-head{align-items:center;display:flex;gap:24px;justify-content:flex-end;padding:22px 0 24px}.stats{display:flex;gap:12px}.stat{align-items:center;border:1px solid;border-radius:16px;display:flex;font-size:14px;font-weight:600;gap:8px;height:70px;justify-content:center;min-width:128px;padding:0 18px}.stat.red{background:var(--red-pale);border-color:#ffe2e2;color:var(--red)}.stat.amber{background:var(--amber-pale);border-color:#fde68a;color:#92400e}.stat.green{background:var(--green-pale);border-color:#d0fae5;color:var(--green)}.big-dot{border-radius:50%;height:11px;width:11px}.red .big-dot{background:#fb2c36}.amber .big-dot{background:#f59e0b}.green .big-dot{background:var(--green2)}
    .records-card{background:var(--page);border:1px solid var(--line2);border-radius:18px;overflow:auto}.records-table{border-collapse:collapse;min-width:1080px;width:100%}.records-table th{border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;height:66px;padding:0 18px;text-align:left;text-transform:uppercase;white-space:nowrap}.records-table td{border-bottom:1px solid var(--line2);height:62px;padding:8px 18px;vertical-align:middle}.records-table tr:last-child td{border-bottom:0}.borrower{align-items:center;display:flex;gap:8px;min-width:205px}.records-table .avatar{align-items:center;background:var(--softline);border-radius:50%;color:var(--text);display:inline-flex;flex:none;font-size:13px;font-weight:800;height:40px;justify-content:center;width:40px}.person-name{color:var(--ink);font-size:14px;font-weight:600;line-height:22px;white-space:nowrap}.person-meta,.subline{color:var(--muted);font-size:12px;line-height:18px;white-space:nowrap}.record-id{color:var(--muted);font-size:11px;line-height:15px}.label{border:1px solid;border-radius:999px;display:inline-flex;font-size:11px;font-weight:500;line-height:20px;margin-top:6px;padding:0 9px}.label.damaged{background:var(--amber-pale);border-color:#fde68a;color:#92400e}.label.lost,.status.flagged{background:var(--red-pale);border-color:#ffe2e2;color:var(--red)}.status{border:1px solid;border-radius:999px;display:inline-flex;font-size:11px;font-weight:500;line-height:20px;padding:0 9px}.status.unflagged{background:var(--green-pale);border-color:#d0fae5;color:var(--green)}.status.pending-replacement{background:var(--red-pale);border-color:#ffe2e2;color:var(--red)}.status.replacement-submitted{background:var(--amber-pale);border-color:#fde68a;color:#92400e}.status.replacement-verified{background:var(--green-pale);border-color:#d0fae5;color:var(--green)}.status.resolved{background:var(--purple-pale);border-color:#ddd6fe;color:var(--purple)}.action{border:0;border-radius:8px;color:#fff;font-size:12px;font-weight:500;height:28px;min-width:86px;padding:0 10px}.action.unflag{background:var(--amber)}.action.flag{background:var(--green)}.action.replace{background:#334155}.action.verify{background:var(--green2)}.action.resolve{background:var(--purple)}.action:hover{filter:brightness(.94)}.action-col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
    .toast{background:#1d293d;border-radius:9px;bottom:20px;box-shadow:0 10px 25px #1d293d33;color:#fff;font-size:13px;left:50%;opacity:0;padding:11px 15px;pointer-events:none;position:fixed;transform:translate(-50%,16px);transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:900px){.page-head{flex-wrap:wrap}.stats{flex-wrap:wrap}}
    @media(max-width:650px){.content{padding:12px}.page-head{padding-top:16px}.stat{height:52px;min-width:104px;padding:0 12px}.stats{gap:8px}.records-card{border-radius:12px}}
  </style>
</head>
<body>
  <div id="app-root" data-page="damage-loss" data-title="Damage and Loss Record Management" data-subtitle="Track and manage equipment damage and loss incidents">
    <section class="page-head"><div class="stats"><div class="stat red"><span class="big-dot"></span><span id="flagged-count">0 Flagged</span></div><div class="stat amber"><span class="big-dot"></span><span id="damaged-count">0 Damaged</span></div><div class="stat green"><span class="big-dot"></span><span id="lost-count">0 Lost</span></div></div></section>
    <section class="records-card" aria-label="Damage and loss records"><table class="records-table"><thead><tr><th>Borrower</th><th>Txn ID / Type</th><th>Equipment</th><th>Condition Details</th><th>Date Reported</th><th>Recorded By</th><th>Resolution Status</th><th>Account</th><th>Actions</th></tr></thead><tbody id="records-body">
    </tbody></table></section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="../../js/shared/api.js"></script>
  <script src="../../js/shared/app-shell.js"></script>
  <script src="../../js/shared/confirm-dialog.js"></script>
  <script>
    const toast=document.getElementById('toast'); let timer;
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}

    // This page previously interpolated borrower/equipment/record fields
    // straight into innerHTML with no escaping at all — unlike every other
    // admin page, which all define this same esc() helper. borrowerName in
    // particular comes from a borrower's self-registered first/last name
    // (server/controllers/auth.controller.js only checks presence, not
    // content), so an unescaped borrower name was a real stored-XSS path
    // into the Director's/Property Custodian's browser session.
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function initials(name){return esc(String(name||'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase()||'?')}
    function labelClass(condition){return condition==='Lost'?'lost':'damaged'}
    function statusClass(s){return String(s).toLowerCase().replace(/\s+/g,'-')}

    let records=[];
    function updateStats(){
      document.getElementById('flagged-count').textContent=records.filter(r=>r.flagged).length+' Flagged';
      document.getElementById('damaged-count').textContent=records.filter(r=>r.incidentType==='Damaged').length+' Damaged';
      document.getElementById('lost-count').textContent=records.filter(r=>r.incidentType==='Lost').length+' Lost';
    }

    // The Replacement step is the required path — resolve() is server-side
    // blocked until a submitted replacement has been verified, matching the
    // key rule: damaged/lost equipment can't be resolved without it.
    function resolutionAction(r){
      if(r.resolutionStatus==='Pending Replacement')return `<button class="action replace" onclick="submitReplacement(${r.id})">Submit Replacement</button>`;
      if(r.resolutionStatus==='Replacement Submitted')return `<button class="action verify" onclick="verifyReplacement(${r.id})">Verify Replacement</button>`;
      if(r.resolutionStatus==='Replacement Verified')return `<button class="action resolve" onclick="resolveRecord(${r.id})">Mark Resolved</button>`;
      return '';
    }

    function row(r){
      const flagBtn=`<button class="action ${r.flagged?'unflag':'flag'}" onclick="toggleFlag(${r.id},${r.flagged})">${r.flagged?'UNFLAG':'FLAG'}</button>`;
      return `<tr>
        <td><div class="borrower"><span class="avatar">${initials(r.borrowerName)}</span><div><div class="person-name">${esc(r.borrowerName)}</div><div class="person-meta">${esc(r.borrowerMeta)}</div></div></div></td>
        <td><div class="record-id">${esc(r.transactionCode)}</div><span class="label ${labelClass(r.incidentType)}">${esc(r.incidentType)}</span></td>
        <td><div>${esc(r.equipmentName)}</div><div class="subline">${esc(r.itemCode)} · ${esc(r.categoryName)}</div></td>
        <td>${esc(r.conditionDetails)}${r.replacementEquipment?`<div class="subline">Replacement: ${esc(r.replacementEquipment)} (${esc(r.replacementDate||'')})</div>`:''}</td>
        <td class="subline">${esc(r.dateReported)}</td>
        <td class="subline">${esc(r.recordedBy)}</td>
        <td><span class="status ${statusClass(r.resolutionStatus)}">${esc(r.resolutionStatus)}</span></td>
        <td><span class="status ${r.flagged?'flagged':'unflagged'}">${r.flagged?'Flagged':'Active'}</span></td>
        <td><div class="action-col">${resolutionAction(r)}${flagBtn}</div></td>
      </tr>`;
    }

    function render(){
      document.getElementById('records-body').innerHTML=records.length
        ?records.map(row).join('')
        :'<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--muted)">No damaged or lost items reported.</td></tr>';
      updateStats();
    }

    function loadRecords(){
      return apiFetch('/api/damage-loss').then(rows=>{records=rows;render();});
    }

    async function submitReplacement(id){
      const equip=await showPromptDialog({title:'Replacement equipment',message:'Describe the equipment used as a replacement.',placeholder:'Replacement equipment (description)'});
      if(equip===null)return;
      if(!equip.trim()){showToast('Enter a replacement equipment description.');return}
      const date=await showPromptDialog({title:'Replacement date',message:'Enter the date the replacement was/will be provided.',placeholder:'YYYY-MM-DD',defaultValue:todayPHDateString()});
      if(date===null)return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date.trim())){showToast('Enter the date as YYYY-MM-DD.');return}
      try{
        await apiFetch(`/api/damage-loss/${id}/replacement`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({replacementEquipment:equip.trim(),replacementDate:date.trim()})});
        await loadRecords();showToast('Replacement submitted');
      }catch(err){showToast(err.message);}
    }
    async function verifyReplacement(id){
      if(!(await showConfirmDialog({title:'Verify replacement?',message:'Confirm this replacement is equivalent to the original equipment.',kind:'success',confirmLabel:'Verify'})))return;
      try{await apiFetch(`/api/damage-loss/${id}/verify`,{method:'PATCH'});await loadRecords();showToast('Replacement verified');}
      catch(err){showToast(err.message);}
    }
    async function resolveRecord(id){
      if(!(await showConfirmDialog({title:'Mark as resolved?',message:'The borrower will be un-restricted once all their records are resolved.',kind:'success',confirmLabel:'Mark Resolved'})))return;
      try{await apiFetch(`/api/damage-loss/${id}/resolve`,{method:'PATCH'});await loadRecords();showToast('Record resolved');}
      catch(err){showToast(err.message);}
    }
    async function toggleFlag(id,isFlagged){
      const record=records.find(r=>r.id===id);
      if(!isFlagged){
        if(!(await showConfirmDialog({title:'Flag this borrower?',message:`Flag ${record.borrowerName}? They can still sign in, but new borrowing requests will be blocked until unflagged.`,kind:'danger',confirmLabel:'Flag'})))return;
        try{await apiFetch(`/api/damage-loss/${id}/flag`,{method:'PATCH'});await loadRecords();showToast('Borrower flagged successfully');}
        catch(err){showToast(err.message);}
      }else{
        if(!(await showConfirmDialog({title:'Unflag this borrower?',message:`Unflag ${record.borrowerName}? This restores their borrowing privileges (any item still pending replacement continues to block new requests).`,kind:'success',confirmLabel:'Unflag'})))return;
        try{await apiFetch(`/api/damage-loss/${id}/unflag`,{method:'PATCH'});await loadRecords();showToast('Borrower unflagged successfully');}
        catch(err){showToast(err.message);}
      }
    }

    loadRecords().catch(err=>showToast('Could not load records: '+err.message));
  </script>
</body>
</html>
