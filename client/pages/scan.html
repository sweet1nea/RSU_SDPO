<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equipment Lookup · RSU-SDPO</title>
<style>
:root{--blue:#1745c7;--green:#00a86b}
*{box-sizing:border-box}
/* This page used to just sit at the top of the viewport with body padding
   — fine on a phone screen (which is nearly all real scans), but on a
   wider screen (a PC webcam scan, or the admin's own browser after the
   in-app scanner redirects here) the card was left stranded in the
   top-left corner of a much bigger window instead of reading as the
   centered, deliberate page it's meant to be. min-height:100vh + flex
   centering fixes that at every viewport size; the side/vertical padding
   is kept so the card never touches the screen edges on a small phone. */
body{font:15px/1.5 Inter,Arial,sans-serif;background:#eef2f7;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px 16px;color:#172139}
.wrap{max-width:420px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;justify-content:center}
/* Real RSU SDPO seal (rsu-sdpo-logo.png) instead of the generic QR-icon
   glyph on a flat blue circle — this is the same seal used for the
   report letterhead and the borrowing-form watermark elsewhere in the
   app, so the brand mark here actually reads as "RSU SDPO" rather than
   just "some app with a QR feature". Kept small (44px, well under the
   50x50 the seal was asked to stay within) and on a plain white card so
   the seal's own colors show through cleanly instead of being tinted or
   inverted like the old icon was.  */
.brand .mark{width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid #e3e9f1;display:grid;place-items:center;padding:4px;flex-shrink:0}
.brand .mark img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-size:15px}
.brand small{color:#7286a3}
.card{background:#fff;border:1px solid #dde6ef;border-radius:16px;box-shadow:0 4px 14px #1c355014;padding:22px;text-align:center}
.card h1{font-size:19px;margin:12px 0 4px}
.code{display:inline-block;font:12px ui-monospace,monospace;color:#4f6380;background:#f1f5f9;border-radius:6px;padding:5px 10px;margin-bottom:14px}
.badge{display:inline-block;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.3px;margin-bottom:16px}
.badge.available{background:#eafff5;color:#00875a}
.badge.borrowed{background:#fff4e0;color:#b45900}
.badge.unknown{background:#fdecea;color:#c0392b}
.rows{text-align:left;border-top:1px solid #eef1f5;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid #eef1f5;font-size:13px}
.row span:first-child{color:#7286a3}
.row span:last-child{color:#172139;font-weight:700;text-align:right}
.row span:last-child.cond-good{color:#00875a}
.row span:last-child.cond-warn{color:#b45900}
.row span:last-child.cond-bad{color:#c0392b}
.note{margin-top:18px;font-size:11px;color:#8ca3c3;line-height:1.5}
.notfound .icon{font-size:34px;margin-bottom:8px}
.backlink{display:none;align-items:center;gap:6px;margin-bottom:14px;color:var(--blue);font-weight:700;text-decoration:none;font-size:13px}
.backlink:hover{text-decoration:underline}
</style></head>
<body>
<div class="wrap">
<div class="brand"><span class="mark"><img src="../assets/images/rsu-sdpo-logo.png" alt="RSU SDPO"></span><div><b>RSU-SDPO</b><small>Sports Development Program Office</small></div></div>
<a class="backlink" id="backLink" href="admin/qr-management.html">← Back to QR Management</a>
<div class="card" id="card"></div>
<p class="note" id="footNote"></p>
</div>
<script>
const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
const code=params.get('code');
// Shown only when this page was reached from the admin's own "Open QR
// Scanner" flow in qr-management.html (marked with from=qr-admin) — a
// student or stakeholder scanning a printed label directly has no admin
// session and no reason to see a link into the admin section.
if(params.get('from')==='qr-admin'){
  const back=$('#backLink');
  back.style.display='inline-flex';
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatDate(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function showNotFound(){
  $('#card').innerHTML=`<div class="notfound"><div class="icon">🔍</div><h1>Item Code not recognized</h1><p style="color:#7286a3">No equipment record was found for <b>${esc(code)}</b>.</p></div>`;
  $('#footNote').textContent='If this label is genuine, the item may not be registered in the system yet.';
}

function showError(message){
  $('#card').innerHTML=`<div class="notfound"><div class="icon">⚠️</div><h1>Couldn't reach the server</h1><p style="color:#7286a3">${esc(message)}</p></div>`;
  $('#footNote').textContent="Make sure you're on the same network as the RSU-SDPO server, then try scanning again.";
}

async function render(){
  if(!code){
    $('#card').innerHTML=`<div class="notfound"><div class="icon">❔</div><h1>No Item Code provided</h1><p style="color:#7286a3">This link is missing a QR code reference.</p></div>`;
    return;
  }
  $('#card').innerHTML='<p style="color:#7286a3">Looking up item…</p>';

  let res, body;
  try{
    res=await fetch('/api/qr/lookup/'+encodeURIComponent(code));
    body=await res.json().catch(()=>null);
  }catch(e){
    showError('Network request failed — ' + e.message);
    return;
  }
  if(res.status===404){ showNotFound(); return; }
  if(!res.ok || !body || !body.success){
    showError((body && body.message) || `Server error (${res.status})`);
    return;
  }

  const item=body.data;
  // Maintenance/Decommissioned item statuses were removed 2026-09-14 per
  // the SDPO's own revised requirements (see migration
  // 022_remove_item_maintenance_status) — Available/Borrowed/Reserved are
  // the only statuses that can occur now, so any other value falls through
  // to the 'unknown' badge/no-availability-text case below, same as before
  // these two statuses ever existed.
  const BADGE_CLASS={Available:'available',Borrowed:'borrowed'};
  const badgeClass=BADGE_CLASS[item.status]||'unknown';
  // The top badge already names the exact status, but a staff member
  // glancing at the rows below it (not just the badge) had no plain-text
  // answer to "can this be borrowed right now?" or "is it damaged?" for
  // anything other than a Borrowed item — Category/Condition showed the
  // same way regardless of status. Availability now always gets its own
  // row (in plain words, not just the color of the badge), and Condition
  // is color-coded so a damaged/lost/under-repair item doesn't read the
  // same as a Good one. Borrower details are still shown only when the
  // item is actually Borrowed, since there's no borrower to show otherwise.
  const AVAILABILITY_TEXT={Available:'Available to borrow',Borrowed:'Borrowed — not available',Reserved:'Reserved — not available'};
  const CONDITION_CLASS={Good:'cond-good',Damaged:'cond-bad',Lost:'cond-bad','Under Repair':'cond-warn'};
  const condClass=CONDITION_CLASS[item.condition]||'';
  $('#card').innerHTML=`
    <span class="badge ${badgeClass}">${esc(item.status)}</span>
    <h1>${esc(item.name)}</h1>
    <span class="code">${esc(item.code)}</span>
    <div class="rows">
      <div class="row"><span>Category</span><span>${esc(item.category||'—')}</span></div>
      <div class="row"><span>Availability</span><span>${esc(AVAILABILITY_TEXT[item.status]||item.status)}</span></div>
      <div class="row"><span>Condition</span><span class="${condClass}">${esc(item.condition||'—')}</span></div>
      ${item.status==='Borrowed'?`<div class="row"><span>Borrowed by</span><span>${esc(item.borrower?item.borrower.name:'—')}</span></div><div class="row"><span>College/Unit</span><span>${esc(item.borrower?item.borrower.collegeOrUnit:'—')}</span></div><div class="row"><span>Checked Out</span><span>${esc(formatDate(item.lastTransaction&&item.lastTransaction.releaseDatetime))}</span></div><div class="row"><span>Due Date</span><span>${esc(formatDate(item.lastTransaction&&item.lastTransaction.expectedReturnDatetime))}</span></div>`:''}
    </div>`;
  $('#footNote').textContent='Live data from the RSU-SDPO database, looked up by this item’s permanent Item Code.';
}
render();
</script>
</body></html>
