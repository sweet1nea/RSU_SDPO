<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borrowing Sports Equipment Form</title>
<style>
  @page{size:A4;margin:12mm}
  *{box-sizing:border-box}
  body{margin:0;background:#e5e7eb;font-family:"Times New Roman",Times,serif;color:#000;font-size:11.5px}
  .bar{position:sticky;top:0;background:#0f172a;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;font-family:Arial,sans-serif;font-size:13px}
  .bar button{background:#009966;color:#fff;border:0;border-radius:6px;padding:7px 16px;font-weight:700;cursor:pointer}
  .page{width:210mm;min-height:297mm;margin:14px auto;background:#fff;padding:12mm;box-shadow:0 2px 8px #0003}
  .head{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;text-align:center}
  .head img{width:64px;height:64px;object-fit:contain}
  .head small{display:block;font-size:11px}.head h2{margin:0;font-size:16px}
  .office{text-align:center;font-weight:700;margin-top:6px;border-top:1.5px solid #000;border-bottom:1.5px solid #000;padding:3px 0;letter-spacing:.3px}
  h3{text-align:center;margin:10px 0 8px;font-size:15px;letter-spacing:1px}
  .row{display:flex;gap:16px;margin:5px 0}.row>div{flex:1}
  .ul{display:inline-block;border-bottom:1px solid #000;min-width:60%;padding:0 4px;min-height:14px;vertical-align:bottom}
  table{width:100%;border-collapse:collapse;margin:8px 0}
  th,td{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top}th{text-align:center;font-size:10.5px}
  td.c{text-align:center}.sig{margin-top:12px}.sig .row{margin:10px 0}
  .guide{margin-top:12px;font-size:10px}.guide b{font-size:10.5px}.guide ol{margin:2px 0 6px 16px;padding:0}
  .foot{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;border-top:1px solid #000;padding-top:4px}
  .status{margin-top:6px;font-size:10px;text-align:right;font-style:italic}
  @media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;width:auto;min-height:0;padding:0}}
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">Print</button><span>Print preview of the Borrowing Sports Equipment Form. Choose A4 in the print dialog.</span></div>
<div class="page" id="page"></div>
<script>
(function(){
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var t=null;try{t=JSON.parse(localStorage.getItem('rsuSdpoBsefPrint')||'null')}catch(e){}
  var page=document.getElementById('page');
  if(!t){page.innerHTML='<p>No transaction selected. Close this tab and use Print BSEF again.</p>';return}
  // One row per equipment type; quantity = number of units on the request.
  var groups=[],idx={};
  (t.items||[]).forEach(function(i){var k=i.name;if(!(k in idx)){idx[k]=groups.length;groups.push({name:k,codes:[],qty:0})}var g=groups[idx[k]];g.qty++;g.codes.push(i.code)});
  var rows=groups.map(function(g,n){return '<tr><td class="c">'+(n+1)+'</td><td>'+esc(g.name)+'<div style="font-size:9.5px">'+esc(g.codes.join(', '))+'</div></td><td class="c">'+g.qty+'</td><td></td><td></td></tr>'}).join('');
  for(var k=groups.length;k<6;k++)rows+='<tr><td class="c">'+(k+1)+'</td><td>&nbsp;</td><td></td><td></td><td></td></tr>';
  var line='<span class="ul"></span>';
  page.innerHTML=
  '<div class="head"><img src="../../assets/images/rsu-university-seal.png" alt=""><div><small>Republic of the Philippines</small><h2>ROMBLON STATE UNIVERSITY</h2><small>Romblon, Philippines</small></div><img src="../../assets/images/rsu-sdpo-logo.png" alt=""></div>'+
  '<div class="office">SPORTS DEVELOPMENT PROGRAM OFFICE</div>'+
  '<h3>BORROWING SPORTS EQUIPMENT FORM</h3>'+
  '<div class="row"><div>Borrower’s Name: <span class="ul">'+esc(t.name)+'</span></div><div>Date: <span class="ul">'+esc(t.date)+'</span></div></div>'+
  '<div class="row"><div>College/Unit: <span class="ul">'+esc(t.college)+'</span></div><div>Time of Request: <span class="ul">'+esc(t.time)+'</span></div></div>'+
  '<div class="row"><div>Borrower Category: <span class="ul">'+esc(t.type)+'</span></div><div>Transaction No.: <span class="ul">'+esc(t.id)+'</span></div></div>'+
  '<p style="margin:8px 0 2px"><b>List of Requested Sports Equipment:</b></p>'+
  '<table><thead><tr><th style="width:36px">NO.</th><th>NAME OF EQUIPMENT / ITEM CODES</th><th style="width:70px">QUANTITY</th><th style="width:90px">AVAILABLE EQUIPMENT</th><th style="width:110px">RETURNED CONDITION</th></tr></thead><tbody>'+rows+'</tbody></table>'+
  '<div>Purpose/Use: <span class="ul" style="min-width:85%">'+esc(t.purpose)+'</span></div>'+
  '<div class="row"><div>Expected Return Date and Time: <span class="ul">'+esc(t.due)+' '+esc(t.dueTime||'')+'</span></div></div>'+
  '<div class="sig">'+
  '<div class="row"><div>Equipment Released by: '+line+'</div><div>Date and Time Released: '+line+'</div></div>'+
  '<div class="row"><div>Equipment Received by: '+line+'</div><div>Date and Time Received: '+line+'</div></div>'+
  '<div class="row"><div>Equipment Returned by: '+line+'</div><div>Date and Time Returned: '+line+'</div></div>'+
  '<div class="row"><div>Equipment Received by: '+line+'</div><div>Date and Time Received: '+line+'</div></div>'+
  '<div class="row" style="margin-top:18px"><div>Borrower’s Signature: '+line+'</div><div>Authorized Personnel Signature: '+line+'</div></div></div>'+
  '<div class="guide"><b>Borrower’s Guidelines</b>'+
  '<div><b>Steps:</b> Borrowing of equipment must be requested and completed at least 2–5 days prior to the scheduled event. The borrower must present any valid ID.</div>'+
  '<div><b>Responsibilities of the Borrower:</b></div><ol><li>Use equipment responsibly and only for the stated purpose.</li><li>Return equipment on time and in good condition.</li><li>Report damages or issues promptly.</li></ol>'+
  '<div><b>Return Process:</b> SDPO staff will inspect the equipment upon return. Damaged or lost equipment must be repaired or replaced by the borrower, depending on the extent of the damage.</div></div>'+
  '<div class="foot"><span>SDPO-00-001</span><span>BSEF No.: '+esc(t.bsf)+'</span><span>Request status: '+esc(t.status)+'</span></div>';
})();
</script>
</body>
</html>
