<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borrowing Sports Equipment Form</title>
<style>
  /* Layout follows the official SDPO form SDPO-00-001 (long bond, 8.5 x 13 in). */
  @page{size:8.5in 13in;margin:0}
  *{box-sizing:border-box}
  body{margin:0;background:#e5e7eb;font-family:"Times New Roman",Times,serif;color:#000;font-size:10pt}
  .bar{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;font-family:Arial,sans-serif;font-size:13px}
  .bar button{background:#009966;color:#fff;border:0;border-radius:6px;padding:7px 16px;font-weight:700;cursor:pointer}.bar button.back{background:transparent;border:1px solid #64748b;color:#fff}.bar span{flex:1;min-width:0;line-height:1.35}
  .page{width:8.5in;height:13in;margin:14px auto;background:#fff;box-shadow:0 2px 8px #0003;position:relative;overflow:hidden;font-size:10pt}
  .head{position:relative;height:1.05in;margin-top:.4in}
  /* Both logos are the same visual size: the seal artwork has a little transparent padding, so it is drawn ~5% larger. */
  .head .seal1{position:absolute;left:.88in;top:-.01in;width:.84in;height:.84in;object-fit:contain}
  .head .seal2{position:absolute;left:1.8in;top:.02in;width:.8in;height:.8in;object-fit:contain}
  .head .iso{position:absolute;right:.95in;top:.04in;width:1.15in;height:auto}
  .head .txt{position:absolute;left:0;right:0;top:.1in;text-align:center;font:10pt/1.35 Arial,Helvetica,sans-serif}
  .head .txt b{display:block;font-size:14pt;line-height:1.3}
  .rule1{border-top:2.5px solid #000;margin-top:.02in}.rule2{border-top:1px solid #000;margin-top:2px}
  .office{text-align:center;font:11pt Arial,Helvetica,sans-serif;margin:3px 0 .1in}
  .rule3{border-top:1.5px solid #000}
  .body{padding:0 1in}
  h3{text-align:center;margin:.12in 0 .08in;font:700 11pt Arial,Helvetica,sans-serif;letter-spacing:.3px}
  .fields{display:grid;grid-template-columns:1.35fr 1fr;column-gap:.3in;row-gap:5px;font-size:8.5pt;font-family:Arial,Helvetica,sans-serif}
  /* label + underlined value; a long value (e.g. a full college name) wraps inside the underline instead of pushing the label out of line */
  .f{display:flex;align-items:flex-end;gap:4px;min-height:15px}.f>*:first-child{flex-shrink:0}.f .u{flex:1;border-bottom:1px solid #000;padding:0 3px;min-height:12px;font-size:9pt;line-height:1.25}
  .f.r{padding-left:0}
  .lbl{font:700 8pt Arial,Helvetica,sans-serif;margin:.12in 0 3px}
  table.eq{width:100%;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:9.5pt}
  table.eq th{border:1px solid #000;padding:5px 4px;font-weight:700;text-align:center;line-height:1.5}
  table.eq td{border:1px solid #000;height:.3in;padding:2px 5px;font-size:9pt}
  table.eq td.c{text-align:center}
  .codes{font-size:7.5pt;color:#333}
  .pu{margin-top:.22in;font:italic 700 8pt Arial,Helvetica,sans-serif}
  .pu .line{display:flex;align-items:flex-end;gap:4px;margin-bottom:6px}.pu .line .u{border-bottom:1px solid #000;font:normal 9pt Arial,Helvetica,sans-serif;padding:0 3px;min-height:12px}
  .sigrow{display:grid;grid-template-columns:1.15fr 1fr;column-gap:.14in;font:700 8pt Arial,Helvetica,sans-serif;margin-bottom:4px}
  .sigrow .f .u{min-height:12px}
  .sigblk{margin-top:.22in}
  .sep{border-top:2px solid #b8b8b8;margin:.24in 0 .12in}
  .gl{font:700 9.5pt Arial,Helvetica,sans-serif;margin-bottom:2px}
  table.g{width:100%;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:9.5pt}
  table.g td,table.g th{border:1px solid #000;padding:7px 6px;vertical-align:middle;text-align:left}
  table.g th{font-style:italic;font-weight:700;padding:3px 6px}
  table.g td.k{width:32%}
  table.g td.ital{font-style:italic;line-height:1.35}
  table.g ol{margin:0;padding-left:1.6em}
  .foot{position:absolute;left:1.05in;right:.85in;bottom:.42in;display:flex;justify-content:space-between;align-items:flex-end;font-family:Arial,Helvetica,sans-serif}
  .foot b{font-size:8pt}.foot small{display:block;font-size:8pt}
  .foot .bsf{font-weight:700;font-size:8.5pt}.foot .bsf span{display:inline-block;min-width:.75in;border-bottom:1px solid #000;text-align:center}
  @media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;width:8.5in;height:13in;page-break-after:avoid}}
</style>
</head>
<body>
<div class="bar"><button class="back" id="backBtn" type="button">&larr; Back</button><button onclick="window.print()">Print</button><span>Print preview of the Borrowing Sports Equipment Form (SDPO-00-001). Choose Long (8.5 x 13 in) paper, margins None.</span></div>
<div class="page" id="page"></div>
<script>
(function(){
  // Back: close the tab if the app opened it, else go to the previous page, else to the page this role came from.
  document.getElementById('backBtn').addEventListener('click',function(){
    var role='';try{role=(JSON.parse(localStorage.getItem('rsuSdpoUser')||'{}').userRole)||''}catch(e){}
    var home=role==='Borrower'?'../user/my-requests.html':'../admin/transaction-management.html';
    if(window.opener){window.close();setTimeout(function(){location.href=home},150);return}
    if(history.length>1){history.back();return}
    location.href=home;
  });
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var t=null;try{t=JSON.parse(localStorage.getItem('rsuSdpoBsefPrint')||'null')}catch(e){}
  var page=document.getElementById('page');
  if(!t){page.innerHTML='<p style="padding:1in">No transaction selected. Close this tab and use Print BSEF again.</p>';return}
  // One row per equipment type; quantity = number of units on the request.
  var groups=[],idx={};
  (t.items||[]).forEach(function(i){var k=i.name;if(!(k in idx)){idx[k]=groups.length;groups.push({name:k,codes:[],qty:0})}var g=groups[idx[k]];g.qty++;g.codes.push(i.code)});
  var rows=groups.map(function(g,n){return '<tr><td class="c">'+(n+1)+'</td><td>'+esc(g.name)+'<div class="codes">'+esc(g.codes.join(', '))+'</div></td><td class="c">'+g.qty+'</td><td></td><td></td></tr>'}).join('');
  for(var k=groups.length;k<5;k++)rows+='<tr><td></td><td></td><td></td><td></td><td></td></tr>';
  var blank='<span class="u"></span>';
  var due=esc(t.due||'')+(t.dueTime?' '+esc(t.dueTime):'');
  page.innerHTML=
  '<div class="head"><img class="seal1" src="../../assets/images/rsu-university-seal.png" alt=""><img class="seal2" src="../../assets/images/rsu-sdpo-logo.png" alt=""><div class="txt">Republic of the Philippines<br><b>ROMBLON STATE UNIVERSITY</b>Romblon, Philippines</div><img class="iso" src="../../assets/images/iso-certification.png" alt=""></div>'+
  '<div class="rule1"></div><div class="rule2"></div>'+
  '<div class="office">SPORTS DEVELOPMENT PROGRAM OFFICE</div><div class="rule3"></div>'+
  '<div class="body">'+
  '<h3>BORROWING SPORTS EQUIPMENT FORM</h3>'+
  '<div class="fields"><div class="f"><span>Borrower’s Name:</span><span class="u">'+esc(t.name)+'</span></div><div class="f r"><span>Date:</span><span class="u">'+esc(t.date)+'</span></div>'+
  '<div class="f"><span>College/Unit:</span><span class="u">'+esc(t.college)+'</span></div><div class="f r"><span>Time of Request:</span><span class="u">'+esc(t.time)+'</span></div></div>'+
  '<div class="lbl">List of Requested Sports Equipment:</div>'+
  '<table class="eq"><thead><tr><th style="width:.45in">NO.</th><th>NAME OF EQUIPMENT</th><th style="width:1.2in">QUANTITY</th><th style="width:1in">NO. AVAILABLE EQUIPMENT</th><th style="width:.95in">RETURNED CONDITION</th></tr></thead><tbody>'+rows+'</tbody></table>'+
  '<div class="pu"><div class="line">Purpose/Use:<span class="u" style="flex:1;font-style:normal">'+esc(t.purpose)+'</span></div>'+
  '<div class="line">Expected Return Date and Time:<span class="u" style="width:1.8in">'+due+'</span></div></div>'+
  '<div class="sigblk">'+
  '<div class="sigrow"><div class="f"><span>Equipment Released by:</span>'+blank+'</div><div class="f"><span>Date and Time Released:</span>'+blank+'</div></div>'+
  '<div class="sigrow"><div class="f"><span>Equipment Received by:</span>'+blank+'</div><div class="f"><span>Date and Time Received:</span>'+blank+'</div></div>'+
  '<div style="height:.2in"></div>'+
  '<div class="sigrow"><div class="f"><span>Equipment Returned by:</span>'+blank+'</div><div class="f"><span>Date and Time Returned:</span>'+blank+'</div></div>'+
  '<div class="sigrow"><div class="f"><span>Equipment Received by:</span>'+blank+'</div><div class="f"><span>Date and Time Received:</span>'+blank+'</div></div>'+
  '<div style="height:.22in"></div>'+
  '<div class="sigrow" style="grid-template-columns:1fr 1fr"><div class="f"><span>Borrower’s Signature:</span>'+blank+'</div><div class="f"><span>Authorized Personnel Signature:</span>'+blank+'</div></div>'+
  '</div>'+
  '<div class="sep"></div>'+
  '<div class="gl">Borrower’s Guidelines:</div>'+
  '<table class="g"><thead><tr><th style="width:32%">STEPS</th><th>GUIDELINES</th></tr></thead><tbody>'+
  '<tr><td colspan="2" class="ital">Borrowing of equipment must be requested and completed at least 2-5 days prior to the scheduled event to ensure availability and proper preparation of the items. The borrowers must present any VALID ID.</td></tr>'+
  '<tr><td class="k">Eligible to Borrow</td><td>Faculty, staff, and employee may borrow equipment/facilities.</td></tr>'+
  '<tr><td class="k">Procedures</td><td><b>Step 1</b>: Fill out a borrower’s slip<br><b>Step 2</b>: Submit the fill out borrower’s slip.<br><b>Step 3</b>: Await approval from the Director, SDPO.<br><b>Step 4</b>: Sign the borrower’s slip upon approval.</td></tr>'+
  '<tr><td class="k">Responsibilities of the Borrower</td><td><ol><li>Use equipment/facilities responsibly and only for the stated purpose.</li><li>Ensure the equipment is returned on time and in good condition.</li><li>Report damages or issues promptly.</li></ol></td></tr>'+
  '<tr><td class="k">Return Process</td><td><ol><li>Return equipment on the agreed date.</li><li>The Sports Development Program Office staff will thoroughly inspect the equipment or facilities upon their return to assess for any damages or loss. If the returned equipment or facilities are found to be damaged or lost, the borrower will be held accountable and will be required to either repair or replace the items, depending on the extent of the damage.</li></ol></td></tr>'+
  '</tbody></table></div>'+
  '<div class="foot"><div><b>SDPO-00-001</b><small>Creation Date: 2024-10-17</small></div><div class="bsf">BSF No.: <span>'+esc(t.bsf)+'</span></div></div>';
})();
</script>
</body>
</html>
