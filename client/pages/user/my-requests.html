<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Requests | RSU-SDPO</title>
  <link rel="stylesheet" href="../../css/shared/app-shell.css">
  <link rel="stylesheet" href="../../css/main.css">
  <style>
    .content{width:100%;max-width:1086px;margin:auto}

    /* ---------- Filter pills + search ---------- */
    .tools{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
    .filters{display:flex;gap:6px;flex-wrap:wrap}
    .filter-pill{border:1px solid var(--color-border);border-radius:999px;background:var(--color-surface);color:var(--color-text-500);padding:6px 12px;font-size:12px;line-height:20px}
    .filter-pill .count{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:999px;background:var(--color-surface-muted);color:var(--color-text-600);margin-left:5px;font-size:10px}
    .filter-pill.active{background:var(--color-accent-green-dark);color:#fff;border-color:var(--color-accent-green-dark)}
    .filter-pill.active .count{background:rgba(255,255,255,.2);color:#fff}
    .tools .search-field{max-width:260px;flex:none}

    /* ---------- Request cards ---------- */
    .cards{display:grid;gap:12px}
    .request-card{overflow:hidden;background:var(--color-surface);border:0.8px solid var(--color-border-soft);border-radius:var(--radius-xl);box-shadow:var(--shadow-card)}
    .request-card__head{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:0.8px solid var(--color-border-soft)}
    .request-id{font-size:15px;font-weight:600;color:var(--color-text-900)}
    .requested-on{margin-top:2px;color:var(--color-text-500);font-size:12px}
    .badge{align-self:start;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
    .badge.pending,.badge.acknowledged,.badge.for-approval{color:#a16207;background:#fef3c7}
    .badge.needs-correction{color:#9a3412;background:#ffedd5}
    .notice-correction{color:#9a3412;font-size:12px}
    .correction-box{margin-top:10px;padding:10px 12px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;border-radius:8px;font-size:12px;line-height:1.5}
    .correction-box b{display:block;margin-bottom:2px}

    /* ---------- Re-upload Documents modal ---------- */
    .wizard-field label{display:block;font-size:12px;font-weight:600;color:var(--color-text-600);margin-bottom:6px}
    .wizard-field input[type=file]{width:100%;font-size:12px;border:1px solid var(--color-border);border-radius:8px;padding:8px 10px;background:var(--color-surface)}
    .badge.approved{color:#059669;background:#d1fae5}
    .badge.rejected{color:#dc2626;background:#fee2e2}
    .badge.cancelled{color:var(--color-text-500);background:var(--color-surface-muted)}
    .badge.completed{color:#2563eb;background:#dbeafe}
    .request-card__body{padding:12px 20px;border-bottom:0.8px solid var(--color-border-soft)}
    .field-label{font-size:11px;color:var(--color-text-500);letter-spacing:.4px;text-transform:uppercase;font-weight:600}
    .items{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:8px;font-size:13px;color:var(--color-text-900)}
    .items b{font-weight:600}
    .total-line{padding-top:6px;color:var(--color-text-500);font-size:12px}
    .total-line b{color:var(--color-text-900)}
    .request-card__foot{padding:14px 20px 16px}
    .return-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:var(--color-text-500);font-size:12px}
    .return-row b{color:var(--color-text-900)}
    .notice-reject{color:#b91c1c;font-size:12px}
    .actions{display:flex;gap:10px;padding-top:12px}

    /* ---------- Details modal ---------- */
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .detail-field small{display:block;margin-bottom:4px;color:var(--color-text-500);font-size:11px;letter-spacing:.3px;text-transform:uppercase}
    .detail-field b{font-size:13px;font-weight:600;color:var(--color-text-900)}
    .modal__body h3{font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--color-text-500);margin:0}
    .detail-items{margin:0;padding:0;list-style:none;border:0.8px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
    .detail-items li{display:flex;justify-content:space-between;padding:11px 13px;border-bottom:0.8px solid var(--color-border-soft);font-size:13px;color:var(--color-text-900)}
    .detail-items li:last-child{border:0}
    .modal-note{border-radius:var(--radius-md);padding:12px 14px;background:var(--color-surface-soft);color:var(--color-text-600);font-size:13px}
    .modal-note.reject{background:#fef2f2;color:#991b1b}

    @media(max-width:650px){.tools{flex-direction:column;align-items:stretch}.tools .search-field{max-width:none}.detail-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="app-root" data-role="user" data-page="my-requests" data-title="My Requests" data-subtitle="Track your equipment borrowing requests and their status.">
    <div class="tools">
      <div class="filters" id="filters"></div>
      <div class="search-field">
        <img src="../../assets/icons/icon-search.svg" alt="">
        <input type="text" id="searchInput" placeholder="Search requests..." aria-label="Search requests">
      </div>
    </div>
    <section class="cards" id="cards" aria-live="polite"></section>
  </div>

  <div class="modal-overlay" id="detailModalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
      <div class="modal__header">
        <div><p class="modal__title" id="detailModalTitle" style="font-size:18px">Request details</p><p class="modal__subtitle" id="detailModalSub"></p></div>
        <button type="button" class="modal__close" data-close-modal="detailModalOverlay" aria-label="Close"><img src="../../assets/icons/icon-close.svg" alt=""></button>
      </div>
      <div class="modal__body" id="detailModalBody"></div>
      <div class="modal__footer" id="detailModalFoot"></div>
    </div>
  </div>

  <div class="modal-overlay" id="reuploadOverlay" hidden>
    <div class="modal modal--narrow" role="dialog" aria-modal="true" aria-labelledby="reuploadTitle">
      <div class="modal__header">
        <div><p class="modal__title" id="reuploadTitle" style="font-size:18px">Re-upload Documents</p><p class="modal__subtitle">Upload a corrected file — this replaces what's currently on file for your account.</p></div>
        <button type="button" class="modal__close" id="reuploadCloseBtn" aria-label="Close"><img src="../../assets/icons/icon-close.svg" alt=""></button>
      </div>
      <div class="modal__body">
        <div class="wizard-field">
          <label for="reuploadValidId">Valid ID (if applicable to your borrower type) — JPG, PNG, WEBP, PDF or DOCX, max 10MB</label>
          <input type="file" id="reuploadValidId" accept="image/jpeg,image/png,image/webp,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        </div>
        <div class="wizard-field" style="margin-top:14px">
          <label for="reuploadAuthDoc">Authorization Document — JPG, PNG, WEBP, PDF or DOCX, max 10MB</label>
          <input type="file" id="reuploadAuthDoc" accept="image/jpeg,image/png,image/webp,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        </div>
        <p id="reuploadError" class="form-error" style="color:#dc2626;font-size:12px;min-height:14px;margin-top:10px"></p>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn-secondary" id="reuploadCancelBtn">Cancel</button>
        <button type="button" class="btn btn-primary" id="reuploadSubmitBtn">Upload</button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="../../js/shared/api.js"></script>
  <script src="../../js/shared/app-shell.js"></script>
  <script>
    // Only the request/approval phase lives here — once equipment is Released
    // it moves to My Borrowings, and closed-out transactions move to History.
    // Single approval step (2026-10-02): a freshly submitted request starts
    // life as 'Acknowledged' (not 'Pending' — that ENUM value is
    // defensive/reserved and never actually assigned by the backend) and
    // goes straight to Approved/Rejected — document review and approval now
    // happen together in one SDPO action. 'For Approval' is kept here only
    // as a legacy fallback so a request that was already sitting in that
    // status before the change still shows correctly to its borrower.
    const REQUEST_STATUSES=['Acknowledged','For Approval','Approved','Rejected','Cancelled'];
    const NOTE_BY_STATUS={
      Pending:'Your request is awaiting SDPO review and approval.',
      Acknowledged:'Your request is awaiting SDPO review and approval.',
      'For Approval':'Your documents were verified. The request is awaiting approval.',
      Approved:'Approved. Please present your student ID when claiming the equipment.',
      Cancelled:'This request was cancelled.'
    };

    function groupItems(items){
      const counts=new Map();
      items.forEach(i=>counts.set(i.name,(counts.get(i.name)||0)+1));
      return Array.from(counts.entries());
    }

    function mapTransaction(t){
      return {
        dbId:t.dbId,
        id:t.id,
        date:t.date,
        status:t.status,
        reason:t.reason||null,
        cancelled:t.cancelledAt||null,
        // Set only while still Pending/Acknowledged *after* SDPO returned it
        // for correction — distinct from a rejection (reserved stock stays
        // held and the request can still be approved once fixed). See
        // server/controllers/borrow.controller.js#serialize.
        needsCorrection:!!t.needsCorrection,
        correctionNote:t.correctionNote||null,
        items:groupItems(t.items),
        total:t.items.length,
        returnDate:t.due+(t.dueTime?' '+t.dueTime:''),
        purpose:t.purpose,
        note:NOTE_BY_STATUS[t.status]
      };
    }

    let requests=[];
    function loadRequests(){
      return apiFetch('/api/borrow/mine').then(rows=>{
        requests=rows.filter(t=>REQUEST_STATUSES.includes(t.status)).map(mapTransaction);
      });
    }

    const filterList=['All','Acknowledged','For Approval','Approved','Rejected','Cancelled'];
    let active='All',term='';
    const ICONS={Pending:'◷',Acknowledged:'◷','For Approval':'◷',Approved:'✓',Rejected:'⊗',Cancelled:'⊘',Completed:'✓'};
    const icon=new Proxy(ICONS,{get:(o,k)=>o[k]||'•'});
    // Borrower-facing label: 'Acknowledged' means submitted, awaiting the
    // single SDPO review-and-approval step. 'For Approval' is legacy-only.
    const statusLabel=s=>s==='Acknowledged'?'Awaiting Approval':s==='For Approval'?'Awaiting Approval':s;
    const classFor=s=>s.toLowerCase().replace(/\s+/g,'-');
    const countFor=s=>s==='All'?requests.length:requests.filter(r=>r.status===s).length;

    const $=id=>document.getElementById(id);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const filtersEl=$('filters'),cards=$('cards'),searchInput=$('searchInput');
    const detailModalOverlay=$('detailModalOverlay'),detailModalTitle=$('detailModalTitle'),detailModalSub=$('detailModalSub'),detailModalBody=$('detailModalBody'),detailModalFoot=$('detailModalFoot');

    function renderFilters(){
      filtersEl.innerHTML=filterList.map(s=>`<button type="button" class="filter-pill ${s===active?'active':''}" data-filter="${s}">${s==='All'?s:statusLabel(s)}<span class="count">${countFor(s)}</span></button>`).join('');
    }

    function renderCards(){
      const rows=requests.filter(r=>(active==='All'||r.status===active)&&`${r.id} ${r.status} ${r.items.map(x=>x[0]).join(' ')}`.toLowerCase().includes(term));
      cards.innerHTML=rows.length?rows.map(r=>`<article class="request-card">
        <div class="request-card__head">
          <div><div class="request-id">Request #${esc(r.id)}</div><div class="requested-on">Requested: ${esc(r.date)}</div></div>
          <span class="badge ${r.needsCorrection?'needs-correction':classFor(r.status)}">${r.needsCorrection?'⚠':icon[r.status]} ${r.needsCorrection?'Needs Correction':esc(statusLabel(r.status))}</span>
        </div>
        <div class="request-card__body">
          <div class="field-label">Equipment Requested</div>
          <div class="items">${r.items.map(([n,q])=>`<span>${esc(n)} — <b>${q} ${q===1?'unit':'units'}</b></span>`).join('')}</div>
          <div class="total-line">Total: <b>${r.total} units</b></div>
          ${r.needsCorrection?`<div class="correction-box"><b>SDPO returned this request for correction</b>${r.correctionNote?esc(r.correctionNote):'Review your submitted documents and re-upload below, then SDPO will review your request again.'}</div>`:''}
        </div>
        <div class="request-card__foot">
          <div class="return-row">
            <span>Expected Return: <b>${esc(r.returnDate)}</b></span>
            ${r.reason?`<span class="notice-reject">⊗ Reason: ${esc(r.reason)}</span>`:r.cancelled?`<span>Cancelled on: ${esc(r.cancelled)}</span>`:''}
          </div>
          <div class="actions">
            <button type="button" class="btn btn-secondary detail-btn" data-id="${esc(r.id)}">View Details</button>
            ${r.needsCorrection?`<button type="button" class="btn btn-primary reupload-btn" data-id="${esc(r.id)}">Re-upload Documents</button>`:''}
            ${['Pending','Acknowledged'].includes(r.status)?`<button type="button" class="btn btn-outline-danger cancel-btn" data-id="${esc(r.id)}">Cancel Request</button>`:''}
          </div>
        </div>
      </article>`).join(''):'<div class="empty-state"><p class="empty-state__title">No requests found</p><p>Try adjusting your filter or search term.</p></div>';
    }

    function openDetails(id){
      const r=requests.find(x=>x.id===id);
      detailModalTitle.textContent=`Request #${r.id}`;
      detailModalSub.textContent=`Requested: ${r.date}`;
      detailModalBody.innerHTML=`<div class="detail-grid">
        <div class="detail-field"><small>Status</small><span class="badge ${r.needsCorrection?'needs-correction':classFor(r.status)}">${r.needsCorrection?'⚠':icon[r.status]} ${r.needsCorrection?'Needs Correction':esc(statusLabel(r.status))}</span></div>
        <div class="detail-field"><small>Expected return</small><b>${esc(r.returnDate)}</b></div>
        <div class="detail-field"><small>Purpose</small><b>${esc(r.purpose)}</b></div>
        <div class="detail-field"><small>Total requested</small><b>${r.total} units</b></div>
      </div>
      <h3>Equipment requested</h3>
      <ul class="detail-items">${r.items.map(([n,q])=>`<li><span>${esc(n)}</span><b>${q} ${q===1?'unit':'units'}</b></li>`).join('')}</ul>
      ${r.needsCorrection?`<div class="correction-box"><b>SDPO returned this request for correction</b>${r.correctionNote?esc(r.correctionNote):'Review your submitted documents and re-upload below, then SDPO will review your request again.'}</div>`:`<div class="modal-note ${r.reason?'reject':''}">${r.reason?'Reason for rejection: '+esc(r.reason):esc(r.note||'')}</div>`}`;
      detailModalFoot.innerHTML=`<button type="button" class="btn btn-secondary" id="modalCloseBtn">Close</button>${r.needsCorrection?'<button type="button" class="btn btn-primary" id="modalReuploadBtn">Re-upload Documents</button>':''}${['Pending','Acknowledged'].includes(r.status)?'<button type="button" class="btn btn-outline-danger" id="modalCancelBtn">Cancel Request</button>':''}`;
      detailModalOverlay.hidden=false;
      $('modalCloseBtn').addEventListener('click',closeDetails);
      const cancelBtn=$('modalCancelBtn');
      if(cancelBtn)cancelBtn.addEventListener('click',()=>cancelRequest(r.id));
      const reuploadBtn=$('modalReuploadBtn');
      if(reuploadBtn)reuploadBtn.addEventListener('click',()=>{closeDetails();openReupload(r.id);});
    }
    function closeDetails(){detailModalOverlay.hidden=true;}

    // Documents live on the borrower's PROFILE (one Valid ID + one
    // Authorization Document), not per-transaction — the same pair every
    // request's review checks — so re-uploading here fixes whichever
    // pending request(s) needed correction; there's no separate "upload for
    // this request" endpoint. POSTs to the same /api/borrowers/me/documents
    // endpoint the new-request wizard uses (equipment-showroom-figma.html).
    const reuploadOverlay=$('reuploadOverlay'),reuploadError=$('reuploadError'),reuploadSubmitBtn=$('reuploadSubmitBtn');
    let reuploadRequestId=null;
    function openReupload(id){
      reuploadRequestId=id;
      $('reuploadValidId').value='';$('reuploadAuthDoc').value='';
      reuploadError.textContent='';
      reuploadOverlay.hidden=false;
    }
    function closeReupload(){reuploadOverlay.hidden=true;}
    $('reuploadCloseBtn').addEventListener('click',closeReupload);
    $('reuploadCancelBtn').addEventListener('click',closeReupload);
    reuploadOverlay.addEventListener('click',e=>{if(e.target===reuploadOverlay)closeReupload();});
    reuploadSubmitBtn.addEventListener('click',()=>{
      const validId=$('reuploadValidId').files[0],authDoc=$('reuploadAuthDoc').files[0];
      if(!validId&&!authDoc){reuploadError.textContent='Choose at least one file to upload.';return;}
      reuploadError.textContent='';reuploadSubmitBtn.disabled=true;reuploadSubmitBtn.textContent='Uploading…';
      // Uploads straight to Supabase Storage (see uploadBorrowerDocument in
      // js/shared/api.js) rather than through this app's server — lets a
      // file be up to 10MB instead of the old 2MB multipart-upload cap.
      // Both fields upload in parallel; either can fail independently.
      Promise.all([
        validId?uploadBorrowerDocument('validId',validId):Promise.resolve(),
        authDoc?uploadBorrowerDocument('authorizationDocument',authDoc):Promise.resolve()
      ])
        .then(()=>{
          closeReupload();
          showToast('Documents updated — SDPO will review your request again.','success');
        })
        .catch(err=>{reuploadError.textContent=err.message;})
        .finally(()=>{reuploadSubmitBtn.disabled=false;reuploadSubmitBtn.textContent='Upload';});
    });
    function cancelRequest(id){
      const r=requests.find(x=>x.id===id);
      if(!confirm('Cancel request '+r.id+'?'))return;
      apiFetch('/api/borrow/'+r.dbId+'/cancel',{method:'PATCH'})
        .then(()=>loadRequests())
        .then(()=>{
          closeDetails();renderFilters();renderCards();
          showToast('Request '+r.id+' has been cancelled.','danger');
        })
        .catch(err=>showToast(err.message,'danger'));
    }

    function showToast(message,type){
      const toast=document.createElement('div');
      toast.className='toast toast--'+(type==='danger'?'danger':'success');
      toast.innerHTML=`<span class="toast__dot"></span><span>${esc(message)}</span>`;
      $('toastStack').appendChild(toast);
      setTimeout(()=>toast.remove(),3200);
    }

    filtersEl.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;active=b.dataset.filter;renderFilters();renderCards();});
    searchInput.addEventListener('input',e=>{term=e.target.value.trim().toLowerCase();renderCards();});
    cards.addEventListener('click',e=>{
      const b=e.target.closest('[data-id]');
      if(!b)return;
      if(b.classList.contains('cancel-btn'))return cancelRequest(b.dataset.id);
      if(b.classList.contains('reupload-btn'))return openReupload(b.dataset.id);
      openDetails(b.dataset.id);
    });
    document.querySelectorAll('[data-close-modal]').forEach(btn=>btn.addEventListener('click',closeDetails));
    detailModalOverlay.addEventListener('click',e=>{if(e.target===detailModalOverlay)closeDetails();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetails();});

    loadRequests().then(()=>{
      renderFilters();
      renderCards();
    }).catch(err=>showToast('Could not load your requests: '+err.message,'danger'));
  </script>
</body>
</html>
